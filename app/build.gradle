plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.mza.tash'
    compileSdk 34

    defaultConfig {
        applicationId "ir.mza.tash"
        minSdk 21
        targetSdk 34
        versionCode 21
        versionName "1.4.4"
    }

    flavorDimensions "market"
    productFlavors {
        myket {
            dimension "market"
            buildConfigField "String", "MARKET", "\"myket\""
            // applicationIdSuffix ".myket" // uncomment if you need separate package
        }
        bazaar {
            dimension "market"
            buildConfigField "String", "MARKET", "\"bazaar\""
            // applicationIdSuffix ".bazaar"
        }
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("TASH_KEYSTORE_PATH")
            if (ksPath != null) {
                storeFile file(ksPath)
                storePassword System.getenv("TASH_KEYSTORE_PASSWORD")
                keyAlias System.getenv("TASH_KEY_ALIAS")
                keyPassword System.getenv("TASH_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("TASH_KEYSTORE_PATH") != null) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.11.0'

    // Cafe Bazaar Poolakey (In-App Billing)
    implementation 'com.github.cafebazaar.Poolakey:poolakey:2.2.0'
}
